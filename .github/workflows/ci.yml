name: CI

# Tarea 4.26 del plan de la fase 5 (corrección M7): 704+ pruebas que hasta
# ahora solo existían como promesa en un portátil. `windows-latest` es el
# único sistema objetivo (docs/convenciones-codigo.md) — probar en Linux
# daría verde en un entorno que nadie usa; PySide6 con QtMultimedia y
# QtTextToSpeech tiene comportamiento específico de Windows que un runner
# Linux no ejercería.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  pruebas:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias (proyecto + dev)
        run: python -m pip install -e ".[dev]"

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

      - name: pytest (rápidas)
        # "not lento" (docs/convenciones-codigo.md): las de volumen (75
        # bolas con 1.000 cartones, respaldo de 10.000 cartones) se dejan
        # fuera del bucle de cada push — corren a mano cuando hace falta.
        run: python -m pytest -q -m "not lento"
